name: kiosk_app
description: Facial recognition attendance kiosk (Android tablet, single camera screen).
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  supabase_flutter: ^2.6.0
  camera: ^0.11.0
  google_mlkit_face_detection: ^0.11.0
  # tflite_flutter's original maintainer (am15h) is inactive, but the
  # package itself is still published and maintained (now under the
  # tensorflow org via github.com/tensorflow/flutter-tflite) and its
  # Interpreter API is stable and well-documented -- used here in favor of
  # the newer `flutter_litert` package, whose API surface isn't pinned down
  # enough to hand-write against without a Flutter toolchain to verify with.
  tflite_flutter: ^0.11.0
  image: ^4.2.0
  path_provider: ^2.1.3
  flutter_tts: ^4.0.0
  sqflite: ^2.3.3
  path: ^1.9.0
  connectivity_plus: ^6.0.5
  bcrypt: ^1.1.3
  cronet_http: ^1.9.0
  http: ^1.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  # sqflite itself talks to platform channels that don't exist under plain
  # `flutter test` (no device/emulator) -- this ffi-backed factory runs the
  # same sqflite API against a real SQLite in the Dart VM, which is what
  # lets attendance_decision_engine_test.dart exercise
  # AttendanceDecisionEngine (and therefore LocalDatabase) without one.
  sqflite_common_ffi: ^2.3.0

flutter:
  uses-material-design: true
  assets:
    - assets/models/
